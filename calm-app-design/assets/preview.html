<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm App Design</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; background: var(--bg); }
  .page { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } }
  .theme { background: var(--bg); color: var(--text); padding: 24px; display: flex; gap: 0; }
  .rail { width: 64px; background: var(--sunken); border-radius: var(--radius-lg); padding: 10px 0;
          display: flex; flex-direction: column; align-items: center; gap: 6px; margin-right: 16px; }
  .rail i { width: 44px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center;
            font-style: normal; font-size: var(--text-xs); color: var(--text-3); }
  .rail i.on { background: var(--surface-2); color: var(--accent-text); }
  main { flex: 1; min-width: 0; }
  h1 { font-size: var(--text-xl); font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--text-2); margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
          padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .num { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text);
         display: grid; place-items: center; font-size: var(--text-xs); font-weight: 600; }
  .title { font-size: var(--text-lg); font-weight: 600; }
  .sum { color: var(--text-3); font-size: var(--text-sm); }
  .btn { font: inherit; font-weight: 500; border-radius: var(--radius-md); padding: 7px 14px; cursor: pointer;
         border: 0; transition: background var(--fast) var(--ease); }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:hover { background: var(--accent-hover); }
  .secondary { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .secondary:hover { background: var(--surface-2); }
  .quiet { background: transparent; color: var(--text-2); padding: 7px 8px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-md); padding: 3px; }
  .seg b { font-weight: 500; padding: 4px 12px; border-radius: 6px; color: var(--text-2); font-size: var(--text-sm); }
  .seg b.on { background: var(--accent-soft); color: var(--text); }
  .search { background: var(--sunken); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 7px 10px; color: var(--text-3); font-size: var(--text-sm); margin: 10px 0 6px; }
  .item { display: flex; gap: 10px; padding: 7px 8px; border-radius: var(--radius-md); align-items: baseline; }
  .item.sel { background: var(--accent-soft); }
  .item span:nth-child(2) { color: var(--text-3); font-size: var(--text-sm); flex: 1; }
  .item span:last-child { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: var(--text-sm); }
  .badge { font-size: var(--text-xs); font-weight: 500; padding: 2px 7px; border-radius: 6px; }
  .ok { background: var(--success-soft); color: var(--success); }
  .warn { background: var(--warning-soft); color: var(--warning); }
  .bad { background: var(--danger-soft); color: var(--danger); }
  .info { background: var(--info-soft); color: var(--info); }
  .bar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .bar div { width: 62%; height: 100%; background: var(--accent); }
  kbd { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-2);
        border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="page">
  <section class="theme" data-theme="dark"></section>
  <section class="theme" data-theme="light"></section>
</div>
<template id="sample">
  <nav class="rail"><i class="on">Video</i><i>Shorts</i><i>Music</i><i>Voice</i></nav>
  <main>
    <h1>Video Studio</h1>
    <p class="lead">Calm, readable and quick — the simple path first.</p>
    <div class="card">
      <div class="row"><span class="num">1</span><span class="title">Scenes</span><span class="sum">3 scenes · 1 ready</span></div>
      <div class="search">Find a clip — press /</div>
      <div class="item sel"><span>Screen recording</span><span>Chrome, Terminal</span><span>2:56</span></div>
      <div class="item"><span>Intro card</span><span>Background scene</span><span>0:05</span></div>
      <div class="item"><span>Outro</span><span>Photo</span><span>0:04</span></div>
    </div>
    <div class="card">
      <div class="row"><span class="num">2</span><span class="title">Look &amp; finish</span></div>
      <div class="row" style="margin-top:10px">
        <span class="seg"><b class="on">1080p</b><b>1440p</b><b>4K</b></span>
        <span class="badge ok">Low risk</span><span class="badge warn">Medium</span>
        <span class="badge bad">High</span><span class="badge info">New</span>
      </div>
      <div class="bar"><div></div></div>
      <div class="sum">Composing video · scene 2 of 3 · about 40 s left</div>
    </div>
    <div class="row">
      <button class="btn primary">Generate video</button>
      <button class="btn secondary">Preview</button>
      <button class="btn quiet">More…</button>
      <span class="sum"><kbd>⌘</kbd> <kbd>↵</kbd> to generate</span>
    </div>
  </main>
</template>
<script>
  for (const el of document.querySelectorAll(".theme")) el.appendChild(document.getElementById("sample").content.cloneNode(true));
</script>
</body>
</html>
